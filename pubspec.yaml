name: field_tracker
publish_to: 'none'
description: Production-oriented Flutter field tracking starter.
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  background_location: ^0.13.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1

flutter:
  uses-material-design: true
